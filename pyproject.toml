[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-mcp-bridge"
version = "0.1.0"
description = "MCP server bridge for OpenClaw Gateway sessions"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
openclaw-mcp-bridge = "openclaw_bridge:main"

[tool.setuptools]
py-modules = ["openclaw_bridge"]
